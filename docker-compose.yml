version: '3.8'

services:
  app:
    build: .
    container_name: cafe-app
    ports:
      - "8080:80"  # Acesso ao site
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    volumes:
      - .:/var/www/html # Sincroniza sua pasta local com o container
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: cafe-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cafe_store
    # ⚠️ IMPORTANTE: Não colocamos "ports: - 3306:3306" aqui
    # Isso evita o conflito com seu Arch Linux e o PHP ainda acessa pelo nome "db"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
